global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files:
  - /etc/prometheus/lab-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['am:9093']
scrape_configs:
  - job_name: service-probe
    scrape_timeout: 800ms
    static_configs:
      - targets: ['probe:8080']
