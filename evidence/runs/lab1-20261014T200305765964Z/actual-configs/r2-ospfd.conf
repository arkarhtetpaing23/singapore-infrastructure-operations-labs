hostname r2
log file /tmp/frr.log
interface p-r1
 ip ospf network point-to-point
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface p-r3
 ip ospf network point-to-point
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface lan
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.2
!
