user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log info;
events { worker_connections 64; }
http {
  access_log /var/log/nginx/access.log;
  server {
    listen 80;
    root /srv/app;
    location = /data.json { default_type application/json; }
    location /health { proxy_pass http://127.0.0.1:8080; }
    location /events { proxy_pass http://127.0.0.1:8080; }
  }
}
